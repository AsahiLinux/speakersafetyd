# J713 (MacBook Air 13" M4). The same chassis and speaker set as the J413
# (M2) and J613 (M3) Airs, so the j613 speaker models apply unchanged: the
# J713 ADT's per-unit DC resistances (/product/audio speaker-thiele-small:
# 4.00 and 4.10 ohm woofers, 3.55 and 3.68 ohm tweeters) match the j613
# nominals (4.00 / 3.72 ohm). The AOP speaker stream is the J616s one:
# twelve sense channels, of which the four amps fill the first eight
# (I then V per amp, LW RW LT RT, from the ADT speaker-config: the j613
# order).

[Globals]
visense_pcm = 2
t_ambient = 50.0
t_hysteresis = 5.0
t_window = 20.0
channels = 12
period = 4096
link_gains = True
uclamp_max = 64

[Controls]
vsense = VSENSE Switch
isense = ISENSE Switch
amp_gain = Amp Gain Volume
volume = Speaker Volume

[Speaker/Left Woofer]
group = 1
tr_coil = 32.10
tr_magnet = 20.00
tau_coil = 4.70
tau_magnet = 66.50
t_limit = 140.0
t_headroom = 10.0
z_nominal = 4.00
z_shunt = 0.00
a_t_20c = 0.00370036
a_t_35c = 0.00351349
is_scale = 3.75
vs_scale = 14
is_chan = 0
vs_chan = 1

[Speaker/Right Woofer]
